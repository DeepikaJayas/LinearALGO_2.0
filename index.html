<!DOCTYPE html>
<html>
<head>
    <title>Employee Retention Predictor</title>
</head>
<body>

    <h1>Employee Retention Prediction</h1>

    <form action="/predict" method="post">

        <input type="text" name="satisfaction" placeholder="Satisfaction Level"><br><br>

        <input type="text" name="evaluation" placeholder="Last Evaluation"><br><br>

        <input type="text" name="projects" placeholder="Number of Projects"><br><br>

        <input type="text" name="hours" placeholder="Monthly Hours"><br><br>

        <input type="text" name="years" placeholder="Years in Company"><br><br>

        <input type="text" name="accident" placeholder="Work Accident (0/1)"><br><br>

        <input type="text" name="promotion" placeholder="Promotion Last 5 Years (0/1)"><br><br>

        <input type="text" name="department" placeholder="Department Number"><br><br>

        <input type="text" name="salary" placeholder="Salary Level"><br><br>

        <button type="submit">Predict</button>

    </form>

    <h2>{{ prediction_text }}</h2>

</body>
</html>
